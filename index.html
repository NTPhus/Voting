<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="img/logo.png" type="image/png" />
    <title>Voting DApp</title>
    <!-- Ethers.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.1/ethers.umd.min.js"></script>
    <script src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <div class="navbar">
      <a href="index.html">🗳️ Vote</a>
      <a href="ListVoters.html" id="admin" class="hidden">📋 Admin</a>
      <button class="open-btn" id="verify-btn" onclick="openModal()">
        🎓 Xác minh sinh viên
      </button>
      <!-- <span class="title">⚡ Decentralized Voting DApp</span> -->
    </div>

    <div style="text-align: center; margin-top: 30px">
      <button onclick="connectMetamask()">🔗 Kết nối ví Metamask</button>
      <p id="metamasknotification">
        Vui lòng xác minh là sinh viên trường Đại học Quy Nhơn trước khi Vote!
      </p>
    </div>

    <div class="container fadeIn">
      <div class="time_close">
        <p id="time"></p>
      </div>
      <span>🗳️ DANH SÁCH SẢN PHẨM PHẦN MỀM</span>
      <table id="candidatesTable">
        <thead>
          <tr>
            <th>STT</th>
            <th>Tên sản phẩm</th>
            <th>Lượt vote</th>
            <th>Hành động</th>
          </tr>
        </thead>
        <tbody id="candidatesBody"></tbody>
      </table>
      <p id="cand"></p>
    </div>

    <div class="container fadeIn">
      <span>💰 Kiểm tra số dư</span>
      <button onclick="getBalance()">Kiểm tra</button>
      <p id="balance"></p>
    </div>

    <!-- Modal Overlay -->
    <div id="modal" class="modal">
      <div class="card">
        <span class="close" onclick="closeModal()">×</span>

        <h2>🎓 Xác minh sinh viên QNU để nhận Token</h2>

        <form onsubmit="submitForm(event)">
          <input id="fullName" placeholder="Họ và tên" required />
          <input id="studentId" placeholder="Mã sinh viên" required />
          <input
            id="email"
            placeholder="Email sinh viên (@st.qnu.edu.vn)"
            type="email"
            required
          />
          <input
            id="walletAddress"
            placeholder="Địa chỉ ví MetaMask"
            required
          />

          <div class="btn_submit">
            <button type="submit">Xác minh & Nhận Token</button>
          </div>
        </form>

        <p id="message"></p>
        <p class="footer">© QNU Voting Token Portal</p>
      </div>
    </div>

    <script>
      window.addEventListener("load", () => {
        loadCandidates();
        voteStatus();
      });

      function openModal() {
        document.getElementById("modal").classList.add("show");
      }

      function closeModal() {
        document.getElementById("modal").classList.remove("show");
      }

      // đóng modal khi click ra ngoài
      window.onclick = function (e) {
        const modal = document.getElementById("modal");
        if (e.target === modal) {
          closeModal();
        }
      };
      async function submitForm(e) {
        e.preventDefault();

        const fullName = document.getElementById("fullName").value.trim();
        const studentId = document.getElementById("studentId").value.trim();
        const email = document.getElementById("email").value.trim();
        const walletAddress = document
          .getElementById("walletAddress")
          .value.trim();

        // Popup loading
        Swal.fire({
          title: "Đang xác minh...",
          text: "Vui lòng chờ trong giây lát",
          allowOutsideClick: false,
          allowEscapeKey: false,
          didOpen: () => Swal.showLoading(),
        });

        try {
          const result = await verifyStudent({
            fullName,
            studentId,
            email,
            walletAddress,
          });
          console.log(result);
          
          document.getElementById("verify-btn").innerHTML = "Xác minh thành công!";
          // Thành công
          await Swal.fire({
            icon: "success",
            title: "✅ Xác minh thành công!",
            text: result.message || "Bạn đủ điều kiện nhận token!",
            confirmButtonText: "OK",
          });

          // (tuỳ bạn) đóng modal + reset form
          closeModal();
          document.getElementById("fullName").value = "";
          document.getElementById("studentId").value = "";
          document.getElementById("email").value = "";
          document.getElementById("walletAddress").value = "";

          // result.data có walletAddress, tokenAmount... -> bạn dùng để mint ở bước sau
          console.log("Verify data:", result.data);
        } catch (err) {
          Swal.fire({
            icon: "error",
            title: "Xác minh thất bại",
            text: err.message || "Có lỗi xảy ra",
            confirmButtonText: "Thử lại",
          });
        }
      }
    </script>
  </body>
</html>
