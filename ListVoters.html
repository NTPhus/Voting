<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="img/logo.png" type="image/png" />
    <title>Voting DApp</title>

    <!-- Ethers.js -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.1/ethers.umd.min.js"></script>
    <script src="main.js"></script>

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Poppins", sans-serif;
        min-height: 100vh;
        background: linear-gradient(-45deg, #1e003a, #37006b, #00346b, #00b8a9);
        background-size: 400% 400%;
        animation: gradientMove 10s ease infinite;
        color: #f5f5f5;
      }

      @keyframes gradientMove {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .navbar {
        background: rgba(0, 0, 0, 0.25);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 24px;
        padding: 16px 0;
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .navbar a {
        color: #fff;
        text-decoration: none;
        font-weight: 500;
        font-size: 17px;
        transition: all 0.25s ease;
      }

      .navbar a:hover {
        color: #8ae8ff;
        text-shadow: 0 0 8px #00fff0;
        transform: translateY(-2px);
      }

      .navbar .title {
        color: #fff;
        font-size: 18px;
        font-weight: 600;
        margin-left: 40px;
        text-shadow: 0 0 10px #ff00ff;
      }

      .container {
        background: rgba(255, 255, 255, 0.07);
        border-radius: 16px;
        padding: 36px 40px;
        margin: 40px auto;
        max-width: 600px;
        text-align: center;
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.15);
      }

      .container span {
        display: block;
        font-size: 22px;
        font-weight: 600;
        color: #80ffea;
        margin-bottom: 20px;
        text-shadow: 0 0 10px #00ffd5;
      }

      button {
        background: linear-gradient(135deg, #00fff0, #00b0ff, #ff00ff);
        background-size: 300% 300%;
        animation: pulse 4s ease infinite;
        color: #fff;
        padding: 8px 18px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
        letter-spacing: 0.5px;
        margin-top: 10px;
      }

      @keyframes pulse {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      button:hover {
        transform: translateY(-3px);
        box-shadow: 0 0 20px #00fff0, 0 0 30px #ff00ff;
      }

      #candidatesTable {
        width: 100%;
        border-collapse: collapse;
        color: #fff;
      }

      #candidatesTable th {
        background: linear-gradient(90deg, #00bcd4, #8e24aa);
        padding: 10px;
      }

      #candidatesTable td {
        padding: 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      }

      #candidatesTable tr:hover {
        background-color: rgba(255, 255, 255, 0.1);
      }

      p {
        margin-top: 12px;
      }
      #metamasknotification,
      #transferStatus {
        text-align: center;
        margin-top: 10px;
        font-weight: 500;
        color: #00ffc6;
      }

      /* ===== Center Metamask button ===== */
      .center {
        text-align: center;
        margin-top: 30px;
      }

      /* ===== Inputs ===== */
      input[type="text"],
      input[type="number"] {
        width: 85%;
        padding: 12px 14px;
        margin: 8px 0;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        outline: none;
        transition: 0.3s ease;
      }

      input[type="text"]:focus,
      input[type="number"]:focus {
        box-shadow: 0 0 8px #00ffc6;
        background: rgba(255, 255, 255, 0.2);
      }

      input::placeholder {
        color: #ccc;
      }

      #studentsTable {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        font-size: 14px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 0 18px rgba(0, 255, 255, 0.25);
      }

      /* Header */
      #studentsTable thead {
        background: linear-gradient(90deg, #00fff0, #8e24aa);
      }

      #studentsTable th {
        padding: 12px 10px;
        text-align: left;
        font-weight: 600;
        color: #fff;
        text-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
      }

      /* Body */
      #studentsTable td {
        padding: 10px;
        color: #f0f0f0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        word-break: break-all;
      }

      /* Hover row */
      #studentsTable tbody tr {
        transition: background 0.3s ease;
      }

      #studentsTable tbody tr:hover {
        background: rgba(0, 255, 255, 0.15);
      }

      /* Row xen kẽ */
      #studentsTable tbody tr:nth-child(even) {
        background: rgba(255, 255, 255, 0.04);
      }

      /* Wallet column */
      #studentsTable td:last-child {
        font-family: monospace;
        font-size: 13px;
        color: #8ae8ff;
      }

      /* Responsive mobile */
      @media (max-width: 600px) {
        #studentsTable th,
        #studentsTable td {
          font-size: 12px;
          padding: 8px;
        }
      }

      .hidden {
        display: none;
      }

      #votersTable {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        font-size: 14px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 0 18px rgba(255, 0, 255, 0.25);
      }

      #votersTable thead {
        background: linear-gradient(90deg, #ff00ff, #00fff0);
      }

      #votersTable th,
      #votersTable td {
        padding: 10px;
        color: #fff;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        word-break: break-all;
      }

      #votersTable tbody tr:hover {
        background: rgba(255, 0, 255, 0.15);
      }
    </style>
  </head>

  <body>
    <div class="navbar">
      <a href="index.html">🗳️ Vote</a>
      <a href="ListVoters.html">📋 Admin</a>
      <!-- <a href="VerifyStudent.html">Verify Student</a> -->
    </div>

    <div class="wrapper">
      <div class="center">
        <button onclick="connectMetamask()">🔗 Kết nối ví Metamask</button>
        <p id="metamasknotification"></p>
      </div>

      <div class="container">
        <form
          method="POST"
          action="/addCandidate"
          enctype="multipart/form-data"
        >
          <span>Thêm sản phẩm</span>
          <input type="text" name="vote" placeholder="Nhập tên sản phẩm..." />
          <button>Thêm</button>
        </form>
      </div>

      <div class="container">
        <span>Chuyển Token</span>
        <input type="text" id="tokenTransfer" placeholder="Amount of Token" />
        <input
          type="text"
          id="walletAddress"
          placeholder="Receiver Wallet Address"
        />
        <button onclick="transferToken()">Transfer</button>
        <p id="transferStatus"></p>
      </div>

      <div class="container">
        <span>Chỉnh sửa thời gian</span>
        <input
          type="number"
          id="durationMinutes"
          placeholder="Nhập thời gian(phút)...."
        />
        <button onclick="resetVotingTime()">Reset</button>
        <p id="resetStatus"></p>
      </div>

      <div class="container">
        <span>Import Student từ Excel</span>

        <input type="file" id="excelFile" accept=".xlsx, .xls" />
        <button onclick="importExcel()">Import</button>

        <p id="importStatus"></p>
      </div>

      <table id="studentsTable" class="hidden">
        <thead>
          <tr>
            <th>Họ tên</th>
            <th>MSSV</th>
            <th>Email</th>
            <th>Wallet</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="container">
      <span>📋 Danh sách người đã vote</span>

      <button onclick="loadVoters()">Tải danh sách voter</button>

      <table id="votersTable" class="hidden">
        <thead>
          <tr>
            <th>STT</th>
            <th>Địa chỉ người Vote</th>
            <th>Sản Phẩm</th>
            <th>Số Token Vote</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <p id="voterStatus"></p>
    </div>
  </body>
</html>
